services:
  - type: web
    name: aromatic-collection-gestion
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: node src/server.js
    disk:
      name: aromatic-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DB_PATH
        value: /app/data/perfumes.db
      - key: JWT_SECRET
        generateValue: true
